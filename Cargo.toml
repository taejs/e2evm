[package]
name = "harborvm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local VM workspace with a Rust core and CLI"
license = "MIT"
repository = "https://github.com/taejs/harborvm"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
